# Build & Unit Test Workflow
# Verifies the production build and unit test suite on every PR/push.
# This is the reproducible build gate that backs the public deployment:
# if this is green, the same `npm run build` artifact is what gets deployed.

name: Build & Unit Tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

# Restrict GITHUB_TOKEN to the minimum this workflow needs (CodeQL hardening).
# It only checks out and builds — read access to repo contents is sufficient.
permissions:
  contents: read

jobs:
  build:
    name: Production build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Run unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # SQLite is fine for the build step; the deploy target supplies the real DATABASE_URL.
          DATABASE_URL: "file:./dev.db"
